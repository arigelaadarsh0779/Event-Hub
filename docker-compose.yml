services:

  backend:
    build:
      context: ./Event-Hub
      dockerfile: Dockerfile

    container_name: eventhub-backend

    ports:
      - "8080:8080"

    restart: unless-stopped


  frontend:
    build:
      context: ./Event-Hub-Frontend
      dockerfile: Dockerfile

    container_name: eventhub-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: unless-stopped


  nginx:
    image: nginx:alpine

    container_name: eventhub-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - frontend
      - backend

    restart: unless-stopped